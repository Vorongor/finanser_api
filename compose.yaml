services:
  pg_finanser:
    image: postgres:17
    container_name: pg_finanser
    env_file: .env
    networks:
      - internal-nw
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  additional_db:
    image: redis:7-alpine
    container_name: finanser_redis
    networks:
      - internal-nw
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: finanser_api
#    volumes:
#      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - internal-nw
#      - proxy-nw
    depends_on:
      pg_finanser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 5
    develop:
      watch:
        - path: ./pyproject.toml
          action: rebuild
        - path: ./.env
          action: rebuild
        - path: ./src
          target: /app/src
          action: sync

  worker:
    build: .
    container_name: finanser_worker
    command: taskiq worker src.config.tkq:broker --fs-discover
    env_file: .env
    networks:
      - internal-nw
    depends_on:
      additional_db:
        condition: service_started
      pg_finanser:
        condition: service_healthy

  migrator:
    build: .
    container_name: migrator_finanser
    env_file: .env
    networks:
      - internal-nw
    depends_on:
      pg_finanser:
        condition: service_healthy
    volumes:
      - ./src/alembic:/app/src/alembic
      - ./alembic.ini:/app/alembic.ini
    command: [ "alembic", "upgrade", "head" ]
    restart: "no"

volumes:
  postgres_data:

networks:
  internal-nw:
    driver: bridge
#  proxy-nw:
#    external: true