name: Lint and Test

on:
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Lint with Ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Create .env file
        run: |
          touch .env
          echo "POSTGRES_DB=finanser_db" >> .env
          echo "POSTGRES_DB_PORT=5432" >> .env
          echo "POSTGRES_USER=finanser" >> .env
          echo "POSTGRES_PASSWORD=some_password" >> .env
          echo "POSTGRES_HOST=pg_finanser" >> .env
          echo "PGADMIN_DEFAULT_EMAIL=admin@gmail.com" >> .env
          echo "PGADMIN_DEFAULT_PASSWORD=admin" >> .env
          echo "SECRET_KEY_ACCESS=838qKq7dGp34hWij3c8txA5ZD2qm9ybt" >> .env
          echo "SECRET_KEY_REFRESH=cFzRk8kllHMW71wQKLXBqDzl24fkhisw" >> .env
          echo "JWT_SIGNING_ALGORITHM=HS256" >> .env
          echo "DOCS_LOGIN=ADMIN" >> .env
          echo "DOCS_PASSWORD=PASSWORD" >> .env

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services
        run: sleep 10

      - name: Run tests inside container
        run: |
          docker compose exec -T api uv run pytest --cov=src

      - name: Shutdown services
        if: always()
        run: docker compose down