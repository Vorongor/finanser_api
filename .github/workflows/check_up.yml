name: Lint and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Lint with Ruff
        run: uv run --group dev ruff check .

      - name: Check formatting
        run: uv run --group dev ruff format --check .

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .env file for CI
        run: |
          cat << 'EOF' > .env
          POSTGRES_DB=finanser_db
          POSTGRES_DB_PORT=5432
          POSTGRES_USER=finanser
          POSTGRES_PASSWORD=some_password
          POSTGRES_HOST=pg_finanser
          PGADMIN_DEFAULT_EMAIL=ci@example.com
          PGADMIN_DEFAULT_PASSWORD=ci-password
          SECRET_KEY_ACCESS=ci-secret-access
          SECRET_KEY_REFRESH=ci-secret-refresh
          JWT_SIGNING_ALGORITHM=HS256
          REDIS_HOST=additional_db
          REDIS_PORT=6379
          AWS_REGION=eu-central-1
          AWS_ACCESS_KEY_ID=dummy
          AWS_SECRET_ACCESS_KEY=dummy
          MAIL_FROM=ci@example.com
          EOF

      - name: Start services
        run: docker compose up --build -d

      - name: Wait for services to be healthy
        run: sleep 20

      - name: Run migrations
        run: docker compose exec -T api alembic upgrade head

      - name: Run tests inside api container
        run: |
          docker compose exec -T api uv run pytest --cov=src

      - name: Shutdown services
        if: always()
        run: docker compose down